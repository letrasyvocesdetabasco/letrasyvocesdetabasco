name: Despliegue Automatizado LVT

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Compilar y Publicar Sitio Oficial LVT
    runs-on: ubuntu-latest
    env:
      # Credenciales públicas de Supabase (opcionales). Se definen en Settings → Secrets and variables → Actions.
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar Proyecto Astro (incluye índice de búsqueda Pagefind)
        run: npm run build

      - name: Publicar en Rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: letrasyvocesdetabasco.org
