<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191614"/>
      <stop offset="50%" stop-color="#241D17"/>
      <stop offset="100%" stop-color="#0F0D0C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF7B38"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8F3812"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#bg)"/>
  <rect x="25" y="25" width="550" height="700" rx="16" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="12 6" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="680" rx="12" fill="none" stroke="#FAF7F0" stroke-width="1" opacity="0.15"/>
  
  <!-- Silhouette of author bust -->
  <g fill="#FAF7F0" opacity="0.22" transform="translate(300, 310)">
    <circle cx="0" cy="-50" r="65"/>
    <path d="M -110 110 C -100 20, 100 20, 110 110 C 80 130, -80 130, -110 110 Z"/>
    <!-- Feather quill -->
    <path d="M 40 -80 C 70 -130, 95 -160, 115 -180 C 110 -150, 95 -120, 75 -90 L 50 -60 Z" fill="url(#gold)" opacity="0.75"/>
  </g>
  
  <!-- Monogram & Emblem -->
  <circle cx="300" cy="490" r="32" fill="#191614" stroke="url(#gold)" stroke-width="2"/>
  <text x="300" y="497" fill="#C59B27" font-family="Georgia, serif" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="2">LVT</text>
  
  <!-- Typography -->
  <text x="300" y="560" fill="#FAF7F0" font-family="Georgia, serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1">ESCRITOR ILUSTRE</text>
  <text x="300" y="590" fill="#C59B27" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="3" text-transform="uppercase">Acervo Patrimonial Canónico</text>
  <text x="300" y="615" fill="#A8A29E" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Sociedad de Escritores Letras y Voces de Tabasco</text>
</svg>